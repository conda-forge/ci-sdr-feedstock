{% set name = "ci-sdr" %}
{% set version = "0.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ci_sdr-{{ version }}.tar.gz
  sha256: 14001603caf6ee836d418849846fca53eb1d32b65433df40661b9ea16454eb43

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - einops
    - numpy
    - python >=3.6
    - scipy
    - pytorch

test:
  imports:
    - ci_sdr
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/fgnt/ci_sdr
  summary: An implementation for the Convolutive transfer function Invariant Signal-to-Distortion Ratio objective for PyTorch
  description: |
    An implementation for the Convolutive transfer function Invariant Signal-to-Distortion Ratio objective for PyTorch as described in the publication Convolutive Transfer Function Invariant SDR training criteria for Multi-Channel Reverberant Speech Separation.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - wietsedv
